env_type: libero
task_suite_name: obstacle_avoidance
safety_level: L0
task_id_filter: null

total_num_envs: null
auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 512
max_episode_steps: 512
# Open-loop action chunks only need a camera observation after their final
# action.  Keep this opt-in because visual audit collection with chunk_size>1
# requires every intermediate frame; natural rollout can safely enable it.
skip_intermediate_renders: false
# Emit worker-side timing often enough to distinguish reset / inference /
# simulator stalls without logging every environment step.
progress_log_interval: 10

use_rel_reward: True
reward_coef: 1.0
reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  camera_heights: 256
  camera_widths: 256

# official_eval emits the benchmark termination on any violation.
# shadow_collect records ordinary violations and continues until raw task
# success, horizon, or a severe-collision hard stop.
episode_auditor:
  enabled: false
  mode: official_eval  # official_eval | shadow_collect
  save_dir: ${runner.logger.log_path}/libero_safety_audits
  include_observations: true
  # Required by the unified Wan/SAM dataset builder. Frames are written to an
  # episode-id-aligned NPZ sidecar, never embedded in the audit JSON.
  save_visual_observations: false
  # Main view matches the current Wan backend. Add robot0_eye_in_hand_image only
  # when a future multi-view model will consume it (roughly doubles image I/O).
  visual_camera_keys: [agentview_image]
  severe_collision:
    # CheckGripperForce already applies LIBERO-Safety's force threshold.
    hard_stop_predicates: [checkgripperforce]
    # Any persistent lower-severity violation is promoted to a hard stop.
    max_consecutive_violation_steps: 8
  counterfactual_branch:
    enabled: false
    # Uniformly choose a pre-action state from this Q1 tail window.
    risk_window_steps: 32
    max_branches_per_root: 16
    target_quadrants: [Q2, Q4]
    # alpha blends the root action with a uniformly sampled action.
    perturbation_range: [0.15, 1.0]
    # Preserve the binary gripper command at index 6 by default.
    action_dimensions: [0, 1, 2, 3, 4, 5]
